[package]
name = "hy300-remoto"
version = "0.1.0"
edition = "2021"

[lib]
name = "hy300_remoto"
path = "src/lib.rs"

[[bin]]
name = "hy300-remoto"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true, features = [] }

[dev-dependencies]
fake = "2"
